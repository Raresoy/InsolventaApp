name: Monitor Insolventa

on:
  schedule:
    - cron: '0 6,10,14,18,22 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instaleaza Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instaleaza librarii
        run: pip install -r insolventa_sistem/insolventa/requirements.txt

      - name: Restaureaza baza de date
        uses: actions/download-artifact@v4
        with:
          name: dosare-db
          path: insolventa_sistem/insolventa/scripts/
        continue-on-error: true

      - name: Ruleaza monitor insolventa
        env:
          GMAIL_USER:      ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD:  ${{ secrets.GMAIL_PASSWORD }}
          TRIBUNALE_JSON:  ${{ secrets.TRIBUNALE_JSON }}
          EMAIL_SUBIECT:   ${{ secrets.EMAIL_SUBIECT }}
          EMAIL_CORP:      ${{ secrets.EMAIL_CORP }}
        run: python monitor.py
        working-directory: insolventa_sistem/insolventa/scripts

      - name: Salveaza baza de date
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dosare-db
          path: insolventa_sistem/insolventa/scripts/dosare.db
          retention-days: 90
          if-no-files-found: warn

      - name: Salveaza log rulare
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ github.run_number }}
          path: insolventa_sistem/insolventa/scripts/monitor.log
          retention-days: 30
          if-no-files-found: warn