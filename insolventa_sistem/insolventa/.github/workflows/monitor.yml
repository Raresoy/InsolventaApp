name: Monitor Insolventa

concurrency:
  group: monitor-insolventa
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 6,10,14,18,22 * * 1-5'

  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database
        uses: actions/download-artifact@v4
        with:
          name: dosare-db
          path: .
        continue-on-error: true

      - name: Run monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          TRIBUNALE_JSON: ${{ secrets.TRIBUNALE_JSON }}
          EMAIL_SUBIECT: ${{ secrets.EMAIL_SUBIECT }}
          EMAIL_CORP: ${{ secrets.EMAIL_CORP }}
        run: python scripts/monitor.py

      - name: Save database
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dosare-db
          path: dosare.db
          retention-days: 90

      - name: Save logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 30