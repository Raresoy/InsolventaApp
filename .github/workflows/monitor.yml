name: Monitor Insolventa

on:
  schedule:
    # Ruleaza Luni-Vineri la orele 6, 10, 14, 18, 22 UTC (= 9, 13, 17, 21, 01 ora Romaniei)
    - cron: '0 6,10,14,18,22 * * 1-5'

  # Permite rulare manuala din interfata GitHub (pentru teste)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Descarca codul ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Instaleaza Python ──────────────────────────────────────────────
      - name: Instaleaza Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Instaleaza dependintele Python ─────────────────────────────────
      # Cauta requirements.txt in radacina sau in scripts/ (oriunde l-ai pus)
      - name: Instaleaza librarii
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f scripts/requirements.txt ]; then
            pip install -r scripts/requirements.txt
          else
            echo "EROARE: requirements.txt nu a fost gasit!" && exit 1
          fi

      # ── 4. Restaureaza baza de date din rularea anterioara ────────────────
      - name: Restaureaza baza de date
        uses: actions/download-artifact@v4
        with:
          name: dosare-db
          path: scripts/
        continue-on-error: true

      # ── 5. Ruleaza scriptul principal ─────────────────────────────────────
      - name: Ruleaza monitor insolventa
        env:
          GMAIL_USER:      ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD:  ${{ secrets.GMAIL_PASSWORD }}
          TRIBUNALE_JSON:  ${{ secrets.TRIBUNALE_JSON }}
          EMAIL_SUBIECT:   ${{ secrets.EMAIL_SUBIECT }}
          EMAIL_CORP:      ${{ secrets.EMAIL_CORP }}
        run: python monitor.py
        working-directory: scripts

      # ── 6. Salveaza baza de date pentru urmatoarea rulare ─────────────────
      - name: Salveaza baza de date
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dosare-db
          path: scripts/dosare.db
          retention-days: 90
          if-no-files-found: warn

      # ── 7. Salveaza log-ul rularii ─────────────────────────────────────────
      - name: Salveaza log rulare
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ github.run_number }}
          path: scripts/monitor.log
          retention-days: 30
          if-no-files-found: warn